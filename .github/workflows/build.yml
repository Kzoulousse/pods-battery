name: Build APK
on:
  push:
    paths: ["PodsBattery.zip"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PodsBattery.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compiler l'APK
        working-directory: PodsBattery
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PodsBattery-apk
          path: PodsBattery/app/build/outputs/apk/debug/app-debug.apk
